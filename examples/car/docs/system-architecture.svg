      .panel { fill: rgba(255,255,255,0.54); stroke: rgba(130,160,166,0.28); stroke-width: 1; }
      .module { fill: rgba(255,255,255,0.44); stroke: rgba(115,145,150,0.30); stroke-width: 1.2; }
      .dash { stroke-dasharray: 8 8; }
    </style>
