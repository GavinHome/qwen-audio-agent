<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="earth" aria-hidden="true">◉</div>
        <div>
          <h1>设置</h1>
          <p>桌面球只连接 Gateway，不管理服务进程。</p>
        </div>
      </header>

      <section class="runtime-status" aria-labelledby="runtime-status-title">
        <h2 id="runtime-status-title">当前运行</h2>
        <dl>
          <div>
            <dt>Gateway</dt>
            <dd id="current-gateway" class="connection-status checking">正在检查…</dd>
          </div>
          <div>
            <dt>Realtime</dt>
            <dd id="current-realtime">正在检查…</dd>
          </div>
          <div>
            <dt>后台 Agent</dt>
            <dd id="current-backend" class="connection-status checking">正在检查…</dd>
          </div>
        </dl>
      </section>

      <form id="settings-form">
        <section>
          <h2>连接</h2>
          <label>
            <span>Gateway 地址</span>
            <input id="gateway-url" type="url" spellcheck="false" required />
          </label>
        </section>

        <section>
          <h2>外观</h2>
          <label>
            <span>球形样式</span>
            <select id="orb-style">
              <option value="fluid">流光声波球</option>
              <option value="goo">液态渐变球</option>
            </select>
          </label>
        </section>

        <section>
          <h2>Gateway 配置</h2>
          <p class="section-note">以下改动保存后，在下次启动 Gateway 时生效。</p>
          <label>
            <span>Realtime 供应商</span>
            <select id="realtime-provider">
              <option value="dashscope">DashScope</option>
            </select>
          </label>
          <label>
            <span>DashScope API Key</span>
            <input id="api-key" type="password" autocomplete="off" />
          </label>
          <label>
            <span>实时模型</span>
            <input
              id="realtime-model"
              type="text"
              spellcheck="false"
              autocomplete="off"
              required
            />
          </label>
          <label>
            <span>实时语音</span>
            <input id="realtime-voice" type="text" spellcheck="false" />
          </label>
        </section>

        <section>
          <h2>后台 Agent</h2>
          <label>
            <span>类型</span>
            <select id="protocol">
              <option value="opencode">OpenCode</option>
              <option value="openclaw">OpenClaw</option>
              <option value="qoder">Qoder</option>
            </select>
          </label>
          <label>
            <span>权限模式</span>
            <select id="backend-permission-mode">
              <option value="native">由后台决定（推荐）</option>
              <option value="full">最高权限（不再逐次确认）</option>
            </select>
          </label>
          <p class="section-note">
            最高权限仅支持由 Gateway 管理的 OpenCode 和 Qoder，会允许后台直接执行命令和修改文件。
          </p>
          <label>
            <span>服务地址</span>
            <input id="backend-url" type="url" spellcheck="false" required />
          </label>
          <label>
            <span>后台模型</span>
            <input
              id="backend-model"
              type="text"
              spellcheck="false"
              autocomplete="off"
              required
            />
          </label>
        </section>

        <p id="message" role="status"></p>
        <footer>
          <button type="submit" disabled>应用</button>
        </footer>
      </form>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
