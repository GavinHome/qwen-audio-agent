<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="earth" aria-hidden="true">◉</div>
        <div>
          <h1>设置</h1>
          <p>桌面球只连接 Gateway，不管理服务进程。</p>
        </div>
      </header>

      <section class="runtime-status" aria-labelledby="runtime-status-title">
        <h2 id="runtime-status-title">当前运行</h2>
        <dl>
          <div>
            <dt>Gateway</dt>
            <dd id="current-gateway" class="connection-status checking">正在检查…</dd>
          </div>
          <div>
            <dt>Realtime</dt>
            <dd id="current-realtime">正在检查…</dd>
          </div>
          <div>
            <dt>后台 Agent</dt>
            <dd id="current-backend" class="connection-status checking">正在检查…</dd>
          </div>
        </dl>
      </section>

      <form id="settings-form">
        <section>
          <h2>连接</h2>
          <label>
            <span>Gateway 地址</span>
            <input id="gateway-url" type="url" spellcheck="false" required />
          </label>
        </section>

        <section>
          <h2>外观</h2>
          <label>
            <span>球形样式</span>
            <select id="orb-style">
              <option value="fluid">流光声波球</option>
              <option value="goo">液态渐变球</option>
            </select>
          </label>
        </section>

        <p id="message" role="status"></p>
        <footer>
          <button type="submit" disabled>应用</button>
        </footer>
      </form>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
