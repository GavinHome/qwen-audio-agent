appId: ai.qwenaudio.agent
productName: Qwen Audio Agent
electronVersion: 43.2.0
asar: true
npmRebuild: false

directories:
  output: dist/desktop

files:
  - desktop/src/**/*
  - shared/runtime-environment.mjs
  - cli/src/runtime.mjs
  - package.json
  - "!node_modules/**/*"

mac:
  category: public.app-category.productivity
  icon: desktop/build/icon.icns
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Qwen Audio Agent 需要使用麦克风进行实时语音对话。
  target:
    - dmg
  artifactName: qwen-audio-agent-${version}-mac-${arch}.${ext}

dmg:
  title: Qwen Audio Agent
  backgroundColor: "#f5f6f7"
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
    - x: 390
      y: 190
      type: link
      path: /Applications
